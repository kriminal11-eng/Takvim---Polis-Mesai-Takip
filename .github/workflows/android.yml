name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk MesaiTakvimi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MesaiTakvimi-apk
          path: MesaiTakvimi.apk

      - name: İndirme sayfasını güncelle (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Mesai Takvimi (${{ github.ref_name }})
          prerelease: true
          files: MesaiTakvimi.apk
          body: |
            Telefona yüklemek için MesaiTakvimi.apk dosyasını indirip açın.
            Commit: ${{ github.sha }}
