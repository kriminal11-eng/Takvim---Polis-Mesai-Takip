name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK paketleri
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk MesaiTakvimi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MesaiTakvimi-apk
          path: MesaiTakvimi.apk

      - name: İndirme sayfasını güncelle (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Mesai Takvimi (${{ github.ref_name }})
          prerelease: true
          files: MesaiTakvimi.apk
          body: |
            Telefona yüklemek için MesaiTakvimi.apk dosyasını indirip açın.
            Commit: ${{ github.sha }}
